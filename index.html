<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    font-family: 'Montserrat', sans-serif;

    background:
        radial-gradient(
            circle at top,
            #f3d8d8 0%,
            #d9aeb1 35%,
            #8f6267 72%,
            #3c272b 100%
        );

    color: #3d292b;
}


/* ==============================
   MAIN
============================== */

.page {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px 15px;
}


/* ==============================
   MAIN CARD
============================== */

.card {
    width: 100%;
    max-width: 620px;

    position: relative;

    padding: 55px 35px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(255,248,246,0.98),
            rgba(247,228,228,0.98)
        );

    border: 1px solid #b88686;

    border-radius: 6px;

    box-shadow:
        0 30px 80px rgba(61,39,42,0.35),
        inset 0 0 50px rgba(170,110,115,0.08);

    overflow: hidden;
}


/* INNER BORDER */

.card::before {
    content: "";

    position: absolute;

    inset: 10px;

    border: 1px solid rgba(155,99,105,0.35);

    pointer-events: none;
}


/* ==============================
   CORNERS
============================== */

.corner {
    position: absolute;

    width: 50px;
    height: 50px;

    border-color: #b88686;

    border-style: solid;

    opacity: 0.8;
}

.tl {
    top: 18px;
    left: 18px;

    border-width: 2px 0 0 2px;
}

.tr {
    top: 18px;
    right: 18px;

    border-width: 2px 2px 0 0;
}

.bl {
    bottom: 18px;
    left: 18px;

    border-width: 0 0 2px 2px;
}

.br {
    bottom: 18px;
    right: 18px;

    border-width: 0 2px 2px 0;
}


/* ==============================
   LOGO
============================== */

.logo {
    width: 100px;
    height: 100px;

    margin: 0 auto 25px;

    border: 2px solid #b88686;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: 'Cormorant Garamond', serif;

    font-size: 58px;

    font-weight: 700;

    color: #8b555b;

    background:
        radial-gradient(
            circle,
            #fff8f6,
            #eed0d1
        );

    box-shadow:
        0 0 30px rgba(145,82,90,0.18),
        inset 0 0 25px rgba(145,82,90,0.08);
}


/* ==============================
   BRAND
============================== */

.brand-name {
    font-family: 'Cormorant Garamond', serif;

    font-size: clamp(48px, 11vw, 78px);

    letter-spacing: 8px;

    line-height: 0.9;

    color: #4a3033;

    text-transform: uppercase;
}

.brand-subtitle {

    margin-top: 17px;

    font-family: 'Cormorant Garamond', serif;

    font-size: 25px;

    letter-spacing: 8px;

    color: #a56d73;

    text-transform: uppercase;
}

.tagline {

    margin-top: 25px;

    font-size: 10px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color: #8d6d70;
}


/* ==============================
   DIVIDER
============================== */

.divider {

    display: flex;

    align-items: center;

    gap: 12px;

    margin: 35px 20px;
}

.divider::before,
.divider::after {

    content: "";

    height: 1px;

    flex: 1;

    background:
        linear-gradient(
            90deg,
            transparent,
            #b88686
        );
}

.divider::after {

    background:
        linear-gradient(
            90deg,
            #b88686,
            transparent
        );
}

.diamond {

    width: 8px;
    height: 8px;

    background: #b88686;

    transform: rotate(45deg);
}


/* ==============================
   INTRO
============================== */

.intro h2 {

    font-family: 'Cormorant Garamond', serif;

    font-size: 34px;

    font-weight: 600;

    color: #573a3d;
}

.intro p {

    max-width: 440px;

    margin: 15px auto 0;

    font-size: 13px;

    line-height: 1.8;

    color: #806b6d;
}


/* ==============================
   COMING SOON
============================== */

.coming-soon {

    margin: 35px auto;

    padding: 32px 22px;

    border: 1px solid #c49396;

    background:
        linear-gradient(
            135deg,
            rgba(255,242,242,0.95),
            rgba(234,201,203,0.75)
        );

    position: relative;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.coming-soon:hover {

    transform: translateY(-4px);

    box-shadow:
        0 12px 30px rgba(110,70,74,0.18);
}

.coming-icon {

    font-size: 40px;

    color: #ae747a;

    margin-bottom: 15px;
}

.coming-soon h3 {

    font-family: 'Cormorant Garamond', serif;

    font-size: 28px;

    font-weight: 600;

    color: #573a3d;

    margin-bottom: 10px;
}

.coming-soon p {

    font-size: 12px;

    line-height: 1.8;

    color: #806b6d;
}


/* ==============================
   SERVICES
============================== */

.services {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 1px;

    margin-top: 25px;

    background: #c99b9e;

    border: 1px solid #c99b9e;
}

.service {

    padding: 22px 8px;

    background:
        linear-gradient(
            145deg,
            #fff7f5,
            #f1dcdc
        );
}

.service-icon {

    font-size: 27px;

    color: #a86d73;

    margin-bottom: 9px;
}

.service h4 {

    font-family: 'Cormorant Garamond', serif;

    font-size: 19px;

    font-weight: 600;

    color: #5b3d40;
}

.service p {

    margin-top: 5px;

    font-size: 8px;

    letter-spacing: 1px;

    text-transform: uppercase;

    color: #907578;
}


/* ==============================
   FOOTER
============================== */

footer {

    margin-top: 40px;
}

.footer-line {

    height: 1px;

    margin-bottom: 22px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #b88686,
            transparent
        );
}

footer p {

    font-family: 'Cormorant Garamond', serif;

    font-size: 21px;

    letter-spacing: 3px;

    color: #8e5c62;
}

footer small {

    display: block;

    margin-top: 10px;

    font-size: 8px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color: #9a7b7e;
}


/* ==============================
   MOBILE
============================== */

@media (max-width: 520px) {

    .page {
        padding: 10px;
    }

    .card {
        padding: 45px 20px;
    }

    .brand-name {
        font-size: 48px;
        letter-spacing: 5px;
    }

    .brand-subtitle {
        font-size: 20px;
        letter-spacing: 5px;
    }

    .services {
        grid-template-columns: 1fr;
    }

    .service {
        padding: 18px;
    }

    .intro h2 {
        font-size: 28px;
    }

}

</style>
